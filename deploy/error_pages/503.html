<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Service Unavailable | EldVatten</title>
    <style>
        * { box-sizing: border-box; }
        body {
            display: flex;
            min-height: 100vh;
            margin: 0;
            padding: clamp(1rem, 4vw, 3rem);
            background: #f4f1e7;
            color: #1b1b19;
            font-family: Georgia, "Times New Roman", serif;
            line-height: 1.6;
        }
        main {
            width: min(100%, 850px);
            margin: auto;
            padding: clamp(2rem, 6vw, 4.5rem);
            border: 1px solid #d7d0bd;
            border-top: 5px solid #a93232;
            border-radius: 10px;
            background: #fffdf7;
            text-align: center;
        }
        .code {
            margin: 0 0 0.5rem;
            color: #7f2525;
            font-size: clamp(5rem, 15vw, 9rem);
            line-height: 1;
        }
        h1 {
            margin: 0 0 1rem;
            font-size: clamp(2rem, 5vw, 3rem);
            font-weight: normal;
        }
        p { max-width: 560px; margin: 0.5rem auto; }
        .hint { color: #666257; }
        a {
            display: inline-block;
            margin-top: 1.5rem;
            padding: 0.65rem 1.1rem;
            border-radius: 4px;
            background: #a93232;
            color: white;
            font-weight: bold;
            text-decoration: none;
        }
        a:hover { background: #7f2525; }
        a:focus-visible { outline: 3px solid #c8a84e; outline-offset: 3px; }
    </style>
</head>
<body>
    <main>
        <p class="code" aria-hidden="true">503</p>
        <h1>Temporarily Unavailable</h1>
        <p>The hall is closed for now. EldVatten cannot accept your request.</p>
        <p class="hint">Please try again later.</p>
        <a href="/">Try Again</a>
    </main>
</body>
</html>
