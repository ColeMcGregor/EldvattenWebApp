<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
</head>
<body>
    <main>
        <h1>Login</h1>

        <form method="post">
            {% csrf_token %}

            {{ form.non_field_errors }}

            <div>
                {{ form.username.errors }}

                <label for="{{ form.username.id_for_label }}">
                    Username
                </label>

                {{ form.username }}
            </div>

            <div>
                {{ form.password.errors }}

                <label for="{{ form.password.id_for_label }}">
                    Password
                </label>

                {{ form.password }}
            </div>

            <button type="submit">
                Login
            </button>
        </form>
    </main>
</body>
</html>
