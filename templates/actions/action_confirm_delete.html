<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delete {{ action.title }}</title>
</head>
<body>
    <main>
        <h1>Delete Action</h1>

        <p>
            Are you sure you want to delete
            <strong>{{ action.title }}</strong>?
        </p>

        <p>
            This will also delete its targets and assignment records.
        </p>

        <form method="post">
            {% csrf_token %}

            <button type="submit">
                Delete Action
            </button>
        </form>

        <p>
            <a href="{% url 'actions:manage_detail' action.id %}">
                Cancel
            </a>
        </p>
    </main>
</body>
</html>
