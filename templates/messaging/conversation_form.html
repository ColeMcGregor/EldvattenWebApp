<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Start Conversation</title>
</head>
<body>
    <main>
        <h1>Start Conversation</h1>

        <form method="post">
            {% csrf_token %}

            {{ form.non_field_errors }}

            <div>
                {{ form.participants.errors }}

                <label for="{{ form.participants.id_for_label }}">
                    Participants
                </label>

                {{ form.participants }}
            </div>

            <button type="submit">
                Start Conversation
            </button>
        </form>

        <p>
            <a href="{% url 'messaging:conversation_list' %}">
                Cancel
            </a>
        </p>
    </main>
</body>
</html>
